name: Release firmware

# Tag a release and everything downstream updates itself:
#   git tag v1.0.1 && git push origin v1.0.1
# builds the sketch, refreshes docs/firmware/ on the default branch (which is
# what GitHub Pages serves to the web installer), and attaches the image to
# the GitHub Release. This is what stops the installer page from quietly
# serving a months-old hand-uploaded binary.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      # Versions are pinned to exactly what the firmware was developed and
      # hardware-tested against. Let these float and a core/library update can
      # silently change behaviour in units already in customers' hands.
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
          arduino-cli lib install FastLED@3.10.3
          arduino-cli lib install WiFiManager@2.0.17

      - name: Build firmware image
        run: |
          chmod +x tools/build-firmware.sh
          ./tools/build-firmware.sh "${{ steps.ver.outputs.version }}"

      - name: Publish the image to the Pages branch
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          BRANCH="${{ github.event.repository.default_branch }}"

          # Stash the freshly built artifacts, because switching branches would
          # clobber them (they're tracked files).
          TMP="$(mktemp -d)"
          cp -R docs/firmware/. "$TMP/"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          # -f discards the build's working-tree changes (already copied to
          # $TMP above) and -B pins the branch to origin, so this works from
          # the detached HEAD that checking out a tag leaves us on.
          git checkout -f -B "$BRANCH" "origin/$BRANCH"

          mkdir -p docs/firmware
          cp -R "$TMP/." docs/firmware/

          if git diff --quiet -- docs/firmware; then
            echo "Firmware image unchanged — nothing to publish."
          else
            git add docs/firmware
            git commit -m "firmware: publish v${VERSION} [skip ci]"
            git push origin "$BRANCH"
            echo "Published v${VERSION} to ${BRANCH}."
          fi

      - name: Attach the image to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: docs/firmware/wordclock/wordclock.bin
          body: |
            Flash this with the [web installer](https://lonely-binary.github.io/WordClock/) —
            no tools needed, just Chrome or Edge.

            `wordclock.bin` is a full-flash image: write it to offset `0x0`.
          generate_release_notes: true
